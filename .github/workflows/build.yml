name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (fetches the latest model from DagsHub)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fastapi-mlflow:latest
          build-args: |
            MLFLOW_TRACKING_URI=https://dagshub.com/ryn2004t/my-dvc-project.mlflow
            MODEL_NAME=my-model
          secrets: |
            dagshub_token=${{ secrets.DAGSHUB_TOKEN }}

      - name: Smoke test /predict
        run: |
          docker run -d -p 8000:8000 --name app fastapi-mlflow:latest
          sleep 15
          FEATURES=$(python3 -c "print(','.join(['0.0']*64))")
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d "{\"features\": [$FEATURES]}"
          docker logs app